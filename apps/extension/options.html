<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Chunkly 设置</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 360px; padding: 16px; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      label { display: block; margin: 10px 0 4px; font-size: 13px; color: #333; }
      input[type="text"], input[type="password"] {
        width: 100%; padding: 6px 8px; box-sizing: border-box; font-size: 13px;
      }
      .preset-row { display: flex; gap: 12px; font-size: 13px; }
      .hint { font-size: 12px; color: #777; margin-top: 4px; }
      button { margin-top: 14px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
      #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
    </style>
  </head>
  <body>
    <h1>Chunkly 设置</h1>

    <div class="preset-row">
      <label><input type="radio" name="preset" value="glm" /> 使用 GLM（智谱）</label>
      <label><input type="radio" name="preset" value="custom" /> 自定义 Provider</label>
    </div>
    <p class="hint">
      GLM 预设已填好官方 API 地址与模型，仍需你自行在
      <a href="https://bigmodel.cn" target="_blank" rel="noopener">bigmodel.cn</a>
      申请 API Key 后填入下方；插件不内置任何可用密钥。
    </p>

    <label for="baseURL">API Base URL</label>
    <input id="baseURL" type="text" placeholder="https://open.bigmodel.cn/api/paas/v4/" />

    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="sk-..." />

    <label for="model">模型名称</label>
    <input id="model" type="text" placeholder="glm-4.7-flash" />

    <button id="save">保存</button>
    <div id="status"></div>

    <script type="module" src="./src/options.ts"></script>
  </body>
</html>
