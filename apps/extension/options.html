<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Chunkly 设置</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --brand: #2563eb;
        --brand-dark: #1d4ed8;
        --ok: #059669;
        --warn: #b45309;
        --err: #dc2626;
        --surface: #f9fafb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --fg: #e5e7eb;
          --muted: #94a3b8;
          --line: #1e293b;
          --brand: #3b82f6;
          --brand-dark: #60a5fa;
          --ok: #34d399;
          --warn: #fbbf24;
          --err: #f87171;
          --surface: #1e293b;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .wrap { max-width: 620px; margin: 0 auto; padding: 40px 24px 64px; }

      header { margin-bottom: 32px; }
      h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.01em; }
      .sub { color: var(--muted); font-size: 13px; margin: 0; }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
      }

      .card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
      h2 { font-size: 14px; margin: 0; font-weight: 600; }
      .card-note { color: var(--muted); font-size: 12px; margin: 0 0 16px; }

      .field { margin-bottom: 16px; }
      .field:last-child { margin-bottom: 0; }
      label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
      .help { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.5; }

      input[type="text"], input[type="password"], select {
        width: 100%;
        padding: 9px 11px;
        font-size: 13px;
        font-family: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 7px;
        transition: border-color .12s, box-shadow .12s;
      }
      input:focus, select:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent);
      }
      input::placeholder { color: var(--muted); opacity: .7; }

      .with-btn { display: flex; gap: 8px; }
      .with-btn input { flex: 1; min-width: 0; }

      .key-row { display: flex; gap: 8px; }
      .key-row input { flex: 1; min-width: 0; }

      .btn {
        padding: 9px 16px;
        font-size: 13px;
        font-family: inherit;
        font-weight: 500;
        color: #fff;
        background: var(--brand);
        border: 1px solid transparent;
        border-radius: 7px;
        cursor: pointer;
        white-space: nowrap;
        transition: background .12s;
      }
      .btn:hover:not(:disabled) { background: var(--brand-dark); }
      .btn:disabled { opacity: .55; cursor: default; }

      .btn-ghost {
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--line);
      }
      .btn-ghost:hover:not(:disabled) { background: var(--surface); }

      .actions { display: flex; gap: 10px; align-items: center; margin-top: 24px; flex-wrap: wrap; }

      .status { font-size: 13px; min-height: 20px; flex: 1; }
      .status.ok { color: var(--ok); }
      .status.warn { color: var(--warn); }
      .status.err { color: var(--err); }

      .presets { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
      .preset {
        flex: 1 1 0;
        min-width: 150px;
        position: relative;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--bg);
        cursor: pointer;
        transition: border-color .12s, box-shadow .12s;
      }
      .preset:hover { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
      .preset input { position: absolute; opacity: 0; pointer-events: none; }
      .preset .p-name { font-size: 13px; font-weight: 600; display: block; }
      .preset .p-desc { font-size: 12px; color: var(--muted); display: block; margin-top: 3px; line-height: 1.4; }
      .preset:has(input:checked) {
        border-color: var(--brand);
        box-shadow: inset 0 0 0 1px var(--brand);
      }
      .preset:has(input:checked) .p-name { color: var(--brand); }

      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }

      .advanced summary {
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        user-select: none;
      }
      .advanced summary:hover { color: var(--fg); }
      .advanced[open] summary { margin-bottom: 16px; }

      code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 12px;
        padding: 1px 5px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--muted) 15%, transparent);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Chunkly</h1>
        <p class="sub">英文网页意群切分。选中文本后按 <code>Alt+Shift+C</code> 即可。</p>
      </header>

      <div class="card">
        <div class="card-head"><h2>服务</h2></div>
        <p class="card-note">选择切分请求走哪个服务。</p>

        <div class="presets">
          <label class="preset">
            <input type="radio" name="preset" value="commandcode" />
            <span class="p-name">CommandCode</span>
            <span class="p-desc">直连官方 API，自带额度</span>
          </label>
          <label class="preset">
            <input type="radio" name="preset" value="local" />
            <span class="p-name">本机网关</span>
            <span class="p-desc">magpie 等 127.0.0.1 服务</span>
          </label>
          <label class="preset">
            <input type="radio" name="preset" value="custom" />
            <span class="p-name">自定义</span>
            <span class="p-desc">任意 OpenAI 兼容接口</span>
          </label>
        </div>

        <div class="field">
          <label for="apiKey">API Key</label>
          <div class="key-row">
            <input id="apiKey" type="password" placeholder="user_..." autocomplete="off" spellcheck="false" />
            <button class="btn btn-ghost" id="toggleKey" type="button">显示</button>
          </div>
          <p class="help" id="keyHelp"></p>
        </div>

        <details class="advanced">
          <summary>高级设置</summary>

          <div class="field">
            <label for="baseURL">API 地址</label>
            <input id="baseURL" type="text" spellcheck="false" />
            <p class="help">OpenAI 兼容的 <code>/chat/completions</code> 根地址。</p>
          </div>

          <div class="row">
            <div class="field">
              <label for="model">模型</label>
              <input id="model" type="text" spellcheck="false" />
            </div>
            <div class="field">
              <label for="reasoningEffort">推理强度</label>
              <select id="reasoningEffort">
                <option value="off">off —— 关闭（推荐）</option>
                <option value="">不传（用服务默认）</option>
                <option value="low">low</option>
                <option value="medium">medium</option>
                <option value="high">high</option>
              </select>
            </div>
          </div>
          <p class="help">
            意群切分是浅层句法任务，开 thinking 不会让结果更好，只会让延迟和 token 翻倍
            （实测 1967ms → 3974ms）。
          </p>
        </details>
      </div>

      <div class="actions">
        <button class="btn" id="save" type="button">保存</button>
        <button class="btn btn-ghost" id="test" type="button">测试连接</button>
        <div class="status" id="status"></div>
      </div>
    </div>

    <script type="module" src="./src/options.ts"></script>
  </body>
</html>
